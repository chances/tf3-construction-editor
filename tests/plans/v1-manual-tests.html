* {

body {

h1 {

.sub {

.bar {

}
.bar > span {

  height: 100%;
  width: 0;
  background: var(--done);
  transition: width .2s;
}
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  margin-top: 8px;
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.stats b {
  color: var(--fg);
}
.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
  align-items: center;
}
button.tool {
  font: inherit;
  font-size: 13px;
  padding: 4px 10px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--fg);
  border-radius: 6px;
  cursor: pointer;
}
button.tool:hover {
  border-color: var(--accent);
}
.sync {
  font-size: 12px;
  color: var(--muted);
  margin-left: auto;
}
section {
  margin-top: 28px;
}
h2 {
  font: 600 19px/1.3 var(--display);
  margin: 0 0 4px;
}
h2 small {
  font: 400 13px var(--body);
  color: var(--muted);
  margin-left: 8px;
  font-variant-numeric: tabular-nums;
}
.intro {
  color: var(--muted);
  font-size: 13px;
  margin: 0 0 8px;
}
.step {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 4px 12px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  align-items: start;
}
.step:first-of-type {
  border-top: 0;
}
.step input[type=checkbox] {
  width: 18px;
  height: 18px;
  margin: 2px 0 0;
  accent-color: var(--accent);
  cursor: pointer;
}
.step label {
  cursor: pointer;
  min-width: 0;
}
.step.done label .t {
  color: var(--muted);
  text-decoration: line-through;
  text-decoration-color: var(--line);
}
.step .exp {
  display: block;
  color: var(--muted);
  font-size: 13px;
}
code {
  font: 12.5px var(--mono);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 4px;
}
.flag {
  grid-column: 3;
  grid-row: 1;
  font-size: 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0 8px;
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
}
.flag[aria-pressed=true] {
  color: var(--fail);

}
textarea.note {
  grid-column: 2 / 4;
  width: 100%;
  font: 13px/1.4 var(--body);
  color: var(--fg);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 8px;
  resize: vertical;
  min-height: 3lh;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.step.fail {
  box-shadow: inset 3px 0 0 var(--fail);
  padding-left: 10px;
}
.hidden-note textarea.note {
  display: none;
}
@media (max-width: 480px) {
  .step {
    grid-template-columns: auto 1fr;
  }
  .flag {
    grid-column: 2;
    grid-row: auto;
    justify-self: start;
  }
  textarea.note {
    grid-column: 2;
  }
}

        "reload",
        "Reload the page and reopen the construction",
        "Faces, labels, modes, own coordinates, and alignment fields are identical. The face selection is not restored.",
      ],
      [
        "restart",
        "Stop and restart dev, then reopen",
        "Nothing is lost, and the texture list and thumbnails still load.",
      ],
    ],
  },
  {
    id: "game",
    title: "In Game",
    intro:
      "Open Verification Items 1 to 5 and 8. Only the game can answer these.",
    steps: [
      [
        "load",
        "Copy the exported mod into the game and start it",
        "The construction appears under its menu category and places without script errors.",
      ],
      [
        "ground",
        "Place a construction with a Fill face and a Stroke Outer face",
        "The ground texture paints inside the face and the stroke paints a soft edge on the outside. Note whether the texture stretches over the face or tiles.",
      ],
    ],
  },
];

const root = document.getElementById("root");
const total = PLAN.reduce((n, s) => n + s.steps.length, 0);
let state = { done: {}, fail: {}, note: {} };
let hideDone = false;
const KEY = "ce-test-plan-p1p2";
let db = null, ref = null, timer = null;

function esc(s) {
  return String(s).replace(
    /[&<>"]/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]),
  );
}
function sid(s, st) {
  return s.id + "." + st[0];
}

function build() {
  root.innerHTML = PLAN.map((s) => `
    <section id="${s.id}">
      <h2>${esc(s.title)}<small data-count="${s.id}"></small></h2>
      <p class="intro">${esc(s.intro)}</p>
      ${
    s.steps.map((st) => {
      const id = sid(s, st);
      return `<div class="step" data-id="${id}">
          <input type="checkbox" id="c-${id}">
          <label for="c-${id}"><span class="t">${
        esc(st[1])
      }</span><span class="exp">${esc(st[2])}</span></label>
          <button class="flag" type="button" aria-pressed="false" title="Mark this step as failing" aria-label="Flag step as failing">Fail</button>
          <textarea class="note" id="n-${id}" placeholder="Notes (what you saw, steps to reproduce)"></textarea>
        </div>`;
    }).join("")
  }
    </section>`).join("");
}

function render() {
  let done = 0, fails = 0;
  for (const el of root.querySelectorAll(".step")) {
    const id = el.dataset.id, d = !!state.done[id], f = !!state.fail[id];
    if (d) done++;
    if (f) fails++;
    el.classList.toggle("done", d);
    el.classList.toggle("fail", f);
    el.hidden = hideDone && d;
    const cb = el.querySelector("input");
    if (cb.checked !== d) cb.checked = d;
    const fl = el.querySelector(".flag");
    fl.setAttribute("aria-pressed", f);
    const ta = el.querySelector("textarea");
    if (document.activeElement !== ta && ta.value !== (state.note[id] || "")) {
      ta.value = state.note[id] || "";
    }
  }
  for (const s of PLAN) {
    const n = s.steps.filter((st) => state.done[sid(s, st)]).length;
    root.querySelector(`[data-count="${s.id}"]`).textContent =
      `${n} / ${s.steps.length}`;
  }
  document.getElementById("fill").style.width = (done / total * 100) + "%";
  document.getElementById("stats").innerHTML =
    `<span><b>${done}</b> of ${total} done</span><span><b>${
      total - done
    }</b> left</span><span><b>${fails}</b> failing</span>`;
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {}
  if (!ref) return;
  clearTimeout(timer);
  timer = setTimeout(async () => {
    try {
      await ref.set({ state: JSON.stringify(state) });
      setSync("Saved");
    } catch (e) {
      setSync("Save failed, kept in this browser");
    }
  }, 400);
}
function setSync(t) {
  document.getElementById("sync").textContent = t;
}

root.addEventListener("change", (e) => {
  const el = e.target.closest(".step");
  if (!el || e.target.type !== "checkbox") return;
  state.done[el.dataset.id] = e.target.checked;
  persist();
  render();
});
root.addEventListener("click", (e) => {
  const b = e.target.closest(".flag");
  if (!b) return;
  const id = b.closest(".step").dataset.id;
  state.fail[id] = !state.fail[id];
  persist();
  render();
});
root.addEventListener("input", (e) => {
  if (e.target.tagName !== "TEXTAREA") return;
  state.note[e.target.closest(".step").dataset.id] = e.target.value;
  persist();
});
document.getElementById("hideDone").addEventListener("click", (e) => {
  hideDone = !hideDone;
  e.target.setAttribute("aria-pressed", hideDone);
  e.target.textContent = hideDone ? "Show Done Steps" : "Hide Done Steps";
  render();
});
document.getElementById("reset").addEventListener("click", (e) => {
  const b = e.target;
  if (b.dataset.armed) {
    state = { done: {}, fail: {}, note: {} };
    delete b.dataset.armed;
    b.textContent = "Reset All";
    persist();
    render();
    return;
  }
  b.dataset.armed = "1";
  b.textContent = "Confirm Reset";
  setTimeout(() => {
    delete b.dataset.armed;
    b.textContent = "Reset All";
  }, 3000);
});

build();
try {
  const raw = localStorage.getItem(KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch (e) {}
render();

(async () => {
  try {
    db = await window.claude?.use("db");
    if (!db) {
      setSync("Saved in this browser");
      return;
    }
    ref = db.doc("plans/phases-1-2");
    setSync("Syncing…");
    ref.onSnapshot((snap) => {
      if (snap.exists) {
        try {
          const s = JSON.parse(snap.data().state);
          if (JSON.stringify(s) !== JSON.stringify(state)) {
            state = Object.assign({ done: {}, fail: {}, note: {} }, s);
            render();
          }
        } catch (e) {}
      }
      setSync("Saved");
    }, () => setSync("Saved in this browser"));
  } catch (e) {
    setSync("Saved in this browser");
  }
})();
</script>
